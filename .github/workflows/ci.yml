# Tests the plugin with Signal K's shared plugin CI:
# Linux (x64 + arm64), macOS, Windows, and optionally armv7/Cerbo GX.
#
# On push/PR this runs with the plugin's own defaults. Use "Run workflow" in
# the Actions UI to override commands, Node versions, armv7 and the Signal K
# integration test without editing this file.

name: SignalK Plugin CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      test-command:
        description: Command to run tests
        required: false
        default: npm test
        type: string
      build-command:
        description: Command to build the plugin
        required: false
        default: npm run build
        type: string
      node-versions:
        description: Node versions, as a JSON array
        required: false
        default: '["22", "24"]'
        type: string
      enable-armv7:
        description: Test on armv7 (Cerbo GX) via QEMU
        required: false
        default: true
        type: boolean
      enable-signalk-integration:
        description: Install and start a Signal K server, then check the plugin loads
        required: false
        default: false
        type: boolean

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch'
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      # armv7 is where this plugin will most often run, and the shared
      # workflow runs it on Node 20, which is the oldest version we claim.
      enable-armv7: true

  ci-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      test-command: ${{ inputs.test-command }}
      build-command: ${{ inputs.build-command }}
      node-versions: ${{ inputs.node-versions }}
      enable-armv7: ${{ inputs.enable-armv7 }}
      enable-signalk-integration: ${{ inputs.enable-signalk-integration }}

  # dist/ is committed so the plugin works when installed straight from git.
  # The server installs plugins with `npm --save --ignore-scripts`, so nothing
  # ever runs `prepare` to build it, and a git checkout would otherwise ship a
  # package whose "main" does not exist. That only holds while dist/ is not
  # stale, which is what this job is for.
  built-output:
    name: dist is in sync with src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: dist/ must match a fresh build
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi
          echo "dist/ matches a fresh build"
